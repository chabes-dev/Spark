  const del=document.getElementById('pdel');
  if(del)del.onclick=()=>sheetConfirm('Delete "'+p.name+'"?','Its sparks, writing and pages stay — they just won\'t belong to a project anymore.','Delete',()=>{
    [S.sparks,S.sessions,S.dumps].forEach(list=>list.forEach(x=>{if(x.projectId===id)x.projectId=null}));
    S.projects=S.projects.filter(x=>x.id!==id);S.ui.view='desk';save();render();
  });
}
function openNewProject(){
  sheet(`<h3>New project</h3>
    <p>A home for related sparks, writing sessions and morning pages.</p>
    <input class="field" id="npname" placeholder="e.g. The novel" />
    <div class="sheet-acts"><button class="btn" id="no">Cancel</button><button class="btn btn-hot" id="yes">Create</button></div>`,
  el=>{
    const inp=el.querySelector('#npname');inp.focus();
    const go=()=>{const v=inp.value.trim();if(!v)return;openProject(newProject(v).id)};
    inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();go()}};
    el.querySelector('#yes').onclick=go;
    el.querySelector('#no').onclick=closeSheet;
  });
}
function wire(){
  app.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>goView(b.dataset.view));
  const rsb=document.getElementById('resumebtn');if(rsb)rsb.onclick=resumeSession;
  const pfb=document.getElementById('pfinishbtn');if(pfb)pfb.onclick=()=>finishSession(false,true);
  if(S.ui.view==='project')wireProject();
  const dp=document.getElementById('deskpages');if(dp)dp.onclick=()=>beginFlow('full');
  const np=document.getElementById('newproj');if(np)np.onclick=openNewProject;
  app.querySelectorAll('[data-proj]').forEach(b=>b.onclick=()=>openProject(b.dataset.proj));
  const heat=document.getElementById('heat');if(heat)heat.scrollLeft=heat.scrollWidth;
  app.querySelectorAll('[data-sproj]').forEach(b=>b.onclick=e=>{e.stopPropagation();
    const s=S.sparks.find(x=>x.id===b.dataset.sproj);if(!s)return;
    pickProject(s.projectId,v=>{s.projectId=v},()=>{closeSheet();render()});
  });
  const cap=document.getElementById('cap');
  if(cap){autosize(cap);cap.addEventListener('input',()=>autosize(cap));
    cap.addEventListener('keydown',e=>{
      if(e.key==='Enter'&&!e.shiftKey){
        e.preventDefault();const v=cap.value.trim();if(!v)return;
        const made=addSpark(v,S.ui.view==='project'?S.ui.projectId:null);made.forEach(x=>x.fresh=true);
        document.getElementById('capbox').classList.add('flash');
        cap.value='';autosize(cap);
        setTimeout(()=>{render();const c=document.getElementById('cap');if(c)c.focus();
          setTimeout(()=>{S.sparks.forEach(x=>delete x.fresh);save()},650)},240);
        toast(made.length>1?made.length+' sparks kept':'kept');
      }});}
  const stb=document.getElementById('startbtn');if(stb)stb.onclick=()=>askPausedThen(()=>beginFlow('full'));
  const qkb=document.getElementById('quickbtn');if(qkb)qkb.onclick=()=>askPausedThen(()=>beginFlow('quick'));
  const mh=document.getElementById('motivhome');if(mh)mh.onclick=openMotivators;
  const at=document.getElementById('archtoggle');if(at)at.onclick=()=>{S.ui.showExplored=!S.ui.showExplored;save();render()};
  const hb=document.getElementById('historybtn');if(hb)hb.onclick=openHistory;
  const db=document.getElementById('dumpsbtn');if(db)db.onclick=openDumps;
  app.querySelectorAll('[data-sedit]').forEach(b=>b.onclick=e=>{e.stopPropagation();openReview('spark',b.dataset.sedit)});
  app.querySelectorAll('[data-explore]').forEach(b=>b.onclick=e=>{e.stopPropagation();toggleExplored(b.dataset.explore)});
  app.querySelectorAll('[data-del]').forEach(b=>b.onclick=e=>{e.stopPropagation();
    const s=S.sparks.find(x=>x.id===b.dataset.del);if(!s)return;
    sheetConfirm('Delete this spark?',s.text,'Delete',()=>{
      const el=document.querySelector('.spark[data-id="'+s.id+'"]');
      const commit=()=>{S.sparks=S.sparks.filter(x=>x.id!==s.id);save();render()};
      if(el)dissolveAndRemove(el,commit);else commit();
    })});
  app.querySelectorAll('[data-edit]').forEach(el=>{
    el.ondblclick=()=>{
      el.contentEditable='true';el.focus();
      const r=document.createRange();r.selectNodeContents(el);r.collapse(false);
      const sel=getSelection();sel.removeAllRanges();sel.addRange(r);
      el.onblur=()=>{const s=S.sparks.find(x=>x.id===el.dataset.edit);
        if(s){const v=el.textContent.trim();if(v)s.text=v;save()}
        el.contentEditable='false';render()};
      el.onkeydown=k=>{if(k.key==='Enter'){k.preventDefault();el.blur()}}};
  });
}

document.addEventListener('keydown',e=>{
  if(document.getElementById('canvas')){
    if(e.key==='Escape'){if(document.getElementById('cpop')){closePopover();return}leaveCanvas(false)}
    return;
  }
  if(mlayer.innerHTML){if(e.key==='Escape')closeSheet();return}
});

/* ---- swipe back / browser back ----
   Spark keeps one extra history entry; a back swipe pops it and Spark goes back one step itself.
   The entry is re-added on the next click or key press (browsers skip entries added without one). */
let NAV_TRAPPED=false;const VIEW_STACK=[];
function armBackTrap(){if(NAV_TRAPPED)return;try{history.pushState({sparkTrap:1},'');NAV_TRAPPED=true}catch(e){}}
['pointerdown','keydown'].forEach(t=>document.addEventListener(t,armBackTrap,true));
window.addEventListener('popstate',()=>{NAV_TRAPPED=false;appBack()});
function goView(view,projectId){
  const same=S.ui.view===view&&(view!=='project'||S.ui.projectId===projectId);
  if(!same){VIEW_STACK.push({view:S.ui.view,projectId:S.ui.projectId});if(VIEW_STACK.length>30)VIEW_STACK.shift()}
  S.ui.view=view;if(projectId)S.ui.projectId=projectId;save();render();if(!same)window.scrollTo(0,0);
}
function appBack(){
  if(document.getElementById('canvas')){leaveCanvas(true);return}
  if(mlayer.innerHTML){closeSheet();return}
  const prev=VIEW_STACK.pop();
  if(prev){S.ui.view=prev.view;S.ui.projectId=prev.projectId;save();render();return}
  if(S.ui.view!=='desk'){S.ui.view='desk';save();render();return}
  history.back(); // already on the Desk: let the browser leave Spark
}

/* ---- boot ---- */
if(S.dumpDraft&&S.dumpDraft.text&&S.dumpDraft.text.trim()){
  S.dumps.unshift(Object.assign({id:nid(),text:S.dumpDraft.text,created:S.dumpDraft.startedAt||Date.now(),words:wc(S.dumpDraft.text),projectId:S.dumpDraft.projectId||null},
    S.dumpDraft.prompt?{prompt:S.dumpDraft.prompt}:{}));
  S.dumpDraft=null;save();
}
pickMotivator();
S.ui.view='desk'; // the app always opens on the Desk
render();
if(S.active&&S.active.paused==null){
  if(Date.now()>=S.active.endsAt)S.active.wrapped=true;
  PHASE='write';openCanvas();
  if(!S.active.wrapped)startTick();
}
</script>
